      <stop offset="0" stop-color="#123024"/>
      <stop offset="1" stop-color="#0A1310"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="8.5" fill="url(#ec-bg)" stroke="#6FBF8E" stroke-opacity="0.55"/>
